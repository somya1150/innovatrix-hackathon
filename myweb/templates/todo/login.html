{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup Form</title>
    <link rel="stylesheet" href="{% static 'todo/login.css' %}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
  <body>
      <div class="container">
          <div class="form-box login">
              <form action="/login/" method="POST">
                {% csrf_token %}
                  <h1>Login</h1>
                  <div class="input-box">
                      <input type="text" name="username" placeholder="Username" >
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="password" name="password" placeholder="Password" >
                      <i class='bx bxs-lock-alt' ></i>
                  </div>
                  <div class="forgot-link">
                      <a href="#">Forgot Password?</a>
                  </div>
                  <button type="submit" class="btn">Login</button>
                  <p>or login with social platforms</p>
                  <div class="social-icons">
                      <a href="#"><i class='bx bxl-google' ></i></a>
                      <a href="#"><i class='bx bxl-facebook' ></i></a>
                      <a href="#"><i class='bx bxl-github' ></i></a>
                      <a href="#"><i class='bx bxl-linkedin' ></i></a>
                  </div>
              </form>
          </div>

          <div class="form-box register">
              <form action="/register/" method="POST">
                {% csrf_token %}
                  <h1>Registration</h1>
                  <div class="input-box">
                      <input type="text" name="name" placeholder="name">
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="text" name="username" placeholder="Username">
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="email" name="email" placeholder="NSEC-Email">
                      <i class='bx bxs-envelope' ></i>
                  </div>
                  <div class="input-box">
                      <input type="text" name="college_id" placeholder="College ID" >
                      <i class='bx bxs-id-card'></i>
                  </div>
                  <div class="input-box">
                      <input type="text" name="sem" placeholder="semester" >
                      <i class='bx bxs-graduation'></i>
                  </div>
                  <div class="input-box">
                      <input type="tel" name="phone" placeholder="Phone-No." >
                      <i class='bx bxs-phone'></i>
                  </div>
                  <div class="input-box">
                      <input type="password" name="password" placeholder="Password" >
                      <i class='bx bxs-lock-alt' ></i>
                  </div>
                  <button type="submit" class="btn btn-primary">Register</button>
                  <p>or register with social platforms</p>
                  <div class="social-icons">
                      <a href="#"><i class='bx bxl-google' ></i></a>
                      <a href="#"><i class='bx bxl-facebook' ></i></a>
                      <a href="#"><i class='bx bxl-github' ></i></a>
                      <a href="#"><i class='bx bxl-linkedin' ></i></a>
                  </div>
              </form>
          </div>

          <div class="toggle-box">
              <div class="toggle-panel toggle-left">
                  <h1>Hello, Welcome!</h1>
                  <p>Don't have an account?</p>
                  <button class="btn register-btn">Register</button>
              </div>

              <div class="toggle-panel toggle-right">
                  <h1>Welcome Back!</h1>
                  <p>Already have an account?</p>
                  <button class="btn login-btn">Login</button>
              </div>
          </div>
      </div>

      <script src="{% static 'todo/login.js'%}"></script>
  </body>
