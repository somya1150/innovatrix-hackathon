{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'todo/shop.css'%}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <section id="header">
        <a href="#"><img src="{% static 'todo/images/logo.png'%}" class="logo" alt="resource loop logo" width="120px"></a>
        <div>
            <ul id="navbar">
                <li><a class="active" href="{% url 'myweb:index' %}">Home</a></li>
                <li><a href="{% url 'myweb:shop' %}">Store</a></li>
                <li><a href="{% url 'myweb:sell' %}">Donate/Sell</a></li>
                <li><a href="{% url 'myweb:impact' %}">Imapact</a></li>
                <li><a href="{% url 'myweb:cart' %}"><i class="fa-solid fa-bag-shopping"></i></a></li>
                <li><a href="{% url 'myweb:login' %}"><button class="btn">Login</button></a></li>
            </ul>
        </div>
    </section>
    <div class="p-container">
            {% for item in products %}
                <div class="p">
                    < a href="{ % url 'myweb:product' id=item.id % }>
                    {% if item.image %}
                        <img src="{{ item.image.url }}" alt="{{ item.name }}">
                    {% endif %}
                    <div class="design">
                        <span>{{ item.condition }}</span>
                        <h5>{{ item.name }}</h5>
                        <h4>Rs. {{ item.price }}</h4>
                        <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
                    </div>
                </div>
                {% endfor %}
